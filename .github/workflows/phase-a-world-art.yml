name: Phase A World Art Gauntlet

on:
  push:
    branches:
      - design/hd-isometric-city-art-system
  pull_request:
    paths:
      - 'world-art/**'
      - 'tools/validate_world_art_manifest.py'
      - 'tools/validate_world_art_images.py'
      - 'tools/verify_phase_a_acceptance.py'
      - 'tools/build_hd_iso_intersection.py'
      - 'tools/compile_city_blueprint.py'
      - 'tests/**world_art**'
      - 'tests/**phase_a**'
      - 'tests/test_city_blueprint*.py'
      - '.github/workflows/phase-a-world-art.yml'

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate HD-ISO-V1 manifest
        run: python tools/validate_world_art_manifest.py world-art/hd-iso-v1/manifest.json

      - name: Python world-art contracts
        run: |
          python -m unittest -v \
            tests.test_world_art_manifest \
            tests.test_world_art_images \
            tests.test_phase_a_acceptance \
            tests.test_hd_iso_intersection_builder \
            tests.test_city_blueprint \
            tests.test_city_blueprint_compiler \
            tests.test_phase_a_street_layout

      - name: Node projection registry scene renderer and player contracts
        run: |
          node --test \
            tests/world_art_calibration.test.js \
            tests/world_art_registry.test.js \
            tests/world_art_renderer.test.js \
            tests/phase_a_scene.test.js \
            tests/phase_a_player.test.js

      - name: Browser preview syntax
        run: |
          node --check world-art/phase-a/calibration-preview.js
          node --check world-art/phase-a/street-layout-preview.js
          node --check world-art/phase-a/playable-preview.js

      - name: Assert unfinished Phase A remains locked
        shell: bash
        run: |
          if python tools/verify_phase_a_acceptance.py world-art/phase-a/acceptance-checklist.json; then
            echo 'REFUSE: Phase A unexpectedly reports full acceptance while Golden Four is incomplete.'
            exit 1
          fi
          echo 'PASS: Phase A correctly remains locked pending visual acceptance.'
